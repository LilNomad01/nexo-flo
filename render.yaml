services:
  - type: web
    name: nexo-flow-web
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nexo-flow-db
          property: connectionString
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SECURE_COOKIES
        value: "1"
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false

databases:
  - name: nexo-flow-db
    databaseName: nexoflow
    user: nexoflow
    plan: free
